name: Windows Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_portable:
        description: 'Build portable executable'
        required: true
        default: 'true'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows-portable:
    name: Build Windows Portable
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build Release
        run: cargo build --release
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
      
      - name: Create releases directory
        run: |
          if not exist "releases" mkdir releases
          echo "Directory created"
        shell: cmd
      
      - name: Prepare portable executable
        run: |
          $version = (Get-Content Cargo.toml | Select-String 'version = "([^"]+)"' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1)
          $date = Get-Date -Format "yyyyMMdd"
          $output = "QVCAD-Windows-Portable-${version}-${date}.exe"
          Copy-Item "target\release\OpenCADStudio.exe" "releases\$output"
          Write-Host "✅ Created: $output"
          Write-Host "Size: $('{0:N2}' -f ((Get-Item "releases\$output").Length / 1MB)) MB"
        shell: powershell
      
      - name: Create ZIP archive
        run: |
          $version = (Get-Content Cargo.toml | Select-String 'version = "([^"]+)"' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1)
          $date = Get-Date -Format "yyyyMMdd"
          $zipName = "QVCAD-Windows-Portable-${version}-${date}.zip"
          $exe = Get-Item "releases\QVCAD-Windows-Portable-*.exe" | Select-Object -Last 1
          Compress-Archive -Path $exe.FullName -DestinationPath "releases\$zipName"
          Write-Host "✅ Created: $zipName"
        shell: powershell
      
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: releases/QVCAD-Windows-*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: windows-portable
          path: releases/QVCAD-Windows-Portable-*

  build-windows-installer:
    name: Build Windows Installer (NSIS)
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Release
        run: cargo build --release
      
      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell
      
      - name: Create installer
        run: |
          $version = (Get-Content Cargo.toml | Select-String 'version = "([^"]+)"' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1)
          $date = Get-Date -Format "yyyyMMdd"
          $installer = "QVCAD-Windows-${version}-${date}-installer.exe"
          
          # Create releases directory
          if (-not (Test-Path "releases")) { New-Item -ItemType Directory -Path "releases" }
          
          # Run makensis
          makensis /DVERSION=$version /DOUTPUT="releases\$installer" OpenCADStudio.nsi
          
          if (Test-Path "releases\$installer") {
            Write-Host "✅ Installer created: $installer"
            Write-Host "Size: $('{0:N2}' -f ((Get-Item "releases\$installer").Length / 1MB)) MB"
          } else {
            Write-Host "❌ Installer creation failed"
            exit 1
          }
        shell: powershell
      
      - name: Upload installer
        uses: actions/upload-artifact@v3
        with:
          name: windows-installer
          path: releases/QVCAD-Windows-*-installer.exe
